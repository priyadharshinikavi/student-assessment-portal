<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        .editor-container {
            height: 400px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        .code-textarea {
            width: 100%;
            height: 100%;
            font-family: monospace;
            padding: 15px;
            border: none;
            resize: none;
            background-color: #272822;
            color: #f8f8f2;
        }
        .code-textarea:focus {
            outline: none;
        }
        #previewFrame {
            width: 100%;
            height: 400px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: white;
        }
        .nav-tabs .nav-link {
            color: #495057;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            color: var(--primary-color);
        }
        
        @media (max-width: 767.98px) {
            .editor-container, #previewFrame {
                height: 250px;
            }
            
            .navbar .d-flex {
                flex-direction: column;
                align-items: flex-end !important;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-capitalize" href="dashboard.html" id="navBrand">Practical Assessment</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" id="studentInfo"></span>
                <span class="badge bg-warning text-dark fs-6"><i class="bi bi-clock"></i> <span id="practicalTimer">90:00</span></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Instructions Panel -->
            <div class="col-lg-3 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Task Requirements</h5>
                    </div>
                    <div class="card-body">
                        <h5 id="taskTitle" class="fw-bold text-primary mb-3"></h5>
                        <div id="taskDescription" class="mb-4"></div>
                        
                        <h6 class="fw-bold">Requirements Check:</h6>
                        <ul class="list-group list-group-flush mb-4" id="reqList">
                            <!-- Requirements injected here -->
                        </ul>
                    </div>
                    <div class="card-footer bg-white">
                        <button class="btn btn-success w-100 fw-bold py-2" id="btnSubmitPractical">SUBMIT TASK</button>
                    </div>
                </div>
            </div>

            <!-- Editor & Preview Panel -->
            <div class="col-lg-9">
                <div class="row h-100">
                    <div class="col-md-6 mb-3">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-light d-flex justify-content-between align-items-center p-0">
                                <ul class="nav nav-tabs border-bottom-0 ms-2 mt-2" id="editorTabs" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link active" id="html-tab" data-bs-toggle="tab" data-bs-target="#html-panel" type="button" role="tab">HTML</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="css-tab" data-bs-toggle="tab" data-bs-target="#css-panel" type="button" role="tab">CSS</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="js-tab" data-bs-toggle="tab" data-bs-target="#js-panel" type="button" role="tab">JS</button>
                                    </li>
                                </ul>
                                <button class="btn btn-sm btn-primary me-2" id="btnRunCode"><i class="bi bi-play-fill"></i> Run</button>
                            </div>
                            <div class="card-body p-0">
                                <div class="tab-content h-100" id="editorContent">
                                    <div class="tab-pane fade show active h-100" id="html-panel" role="tabpanel">
                                        <textarea class="code-textarea" id="htmlEditor" spellcheck="false" placeholder="<!-- Write HTML here -->"></textarea>
                                    </div>
                                    <div class="tab-pane fade h-100" id="css-panel" role="tabpanel">
                                        <textarea class="code-textarea" id="cssEditor" spellcheck="false" placeholder="/* Write CSS here */"></textarea>
                                    </div>
                                    <div class="tab-pane fade h-100" id="js-panel" role="tabpanel">
                                        <textarea class="code-textarea" id="jsEditor" spellcheck="false" placeholder="// Write JavaScript here"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-light">
                                <h6 class="mb-0 py-1"><i class="bi bi-browser-chrome"></i> Live Preview</h6>
                            </div>
                            <div class="card-body p-0">
                                <iframe id="previewFrame"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Submit Modal -->
    <div class="modal fade" id="submitPracticalModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Submit Practical Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to submit your task?</p>
                    <div class="alert alert-info">
                        Your code will be evaluated automatically where possible, and saved for Trainer Review.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmSubmitPractical">Confirm Submission</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/timer.js"></script>
    
    <!-- Load Practical Data -->
    <script src="data/htmlPractical.js"></script>
    <script src="data/cssPractical.js"></script>
    <script src="data/bootstrapPractical.js"></script>
    <script src="data/javascriptPractical.js"></script>
    <script src="data/jqueryPractical.js"></script>
    
    <script src="js/practical.js"></script>
</body>
</html>
