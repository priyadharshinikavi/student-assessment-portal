<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">Assessment Portal</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" id="navUserInfo"></span>
                <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <h2 id="welcomeMsg" class="mb-1">Welcome</h2>
                <p class="text-muted" id="rollMsg"></p>
                <h4 class="mt-4 border-bottom pb-2">Your Progress</h4>
            </div>
        </div>

        <div class="row" id="subjectsContainer">
            <!-- Subject cards will be dynamically injected here -->
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js?v=2"></script>
</body>
</html>
