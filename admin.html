<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-dark d-flex align-items-center" href="#">
                <i class="bi bi-shield-lock-fill text-primary me-2 fs-4"></i>
                Admin Proctoring Dashboard
            </a>
            <div class="d-flex align-items-center">
                <div class="d-flex align-items-center me-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 35px; height: 35px;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <span class="fw-semibold text-secondary">Priya</span>
                </div>
                <button class="btn btn-outline-danger btn-sm px-3 fw-medium" onclick="sessionStorage.removeItem('adminAuth'); window.location.href='login.html'">
                    <i class="bi bi-box-arrow-right me-1"></i> Exit
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4 mb-5">
        
        <!-- Top Control Bar (Search & Actions) -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <h5 class="mb-0 fw-bold text-secondary">Dashboard Overview</h5>
                        <div class="d-flex gap-2 align-items-center flex-wrap">
                            <div class="input-group" style="max-width: 400px;">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="adminSearchFilter" class="form-control border-start-0 bg-light" placeholder="Search by Roll Number or Name...">
                            </div>
                            <button class="btn btn-outline-danger" onclick="clearHistory()">
                                <i class="bi bi-trash3-fill me-1"></i> Clear History
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Student Scores Table -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-2 rounded me-3 text-primary">
                            <i class="bi bi-journal-check fs-5"></i>
                        </div>
                        <h5 class="mb-0 fw-bold">Completed Assessments</h5>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-uppercase text-muted small fw-semibold py-3 rounded-start">Roll No</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3">Name</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3">Subject</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3">Score</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3 rounded-end">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="scoresTableBody" class="border-top-0">
                                    <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Loading data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Proctor Logs Table -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex align-items-center">
                        <div class="bg-danger bg-opacity-10 p-2 rounded me-3 text-danger">
                            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                        </div>
                        <h5 class="mb-0 fw-bold">Live Security Alerts</h5>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-uppercase text-muted small fw-semibold py-3 rounded-start">Time</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3">Roll No</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3">Name</th>
                                        <th class="text-uppercase text-muted small fw-semibold py-3 rounded-end">Violation Detail</th>
                                    </tr>
                                </thead>
                                <tbody id="logsTableBody" class="border-top-0">
                                    <tr><td colspan="4" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Loading data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('adminAuth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js?v=2"></script>
    <script src="js/admin.js?v=2"></script>
    <script src="js/app.js?v=9"></script>
</body>
</html>
