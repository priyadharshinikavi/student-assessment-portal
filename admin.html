<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Admin Proctoring Dashboard</a>
            <div class="d-flex text-white align-items-center">
                <span class="me-3">Admin: Priya</span>
                <button class="btn btn-outline-light btn-sm" onclick="window.location.href='login.html'">Exit</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Student Scores Table -->
            <div class="col-lg-6 mb-4">
                <div class="card h-100 border-primary">
                    <div class="card-header bg-primary text-white fw-bold">
                        Completed Assessments
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Roll No</th>
                                        <th>Name</th>
                                        <th>Subject</th>
                                        <th>Score</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="scoresTableBody">
                                    <tr><td colspan="5" class="text-center">Loading Firebase data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Proctor Logs Table -->
            <div class="col-lg-6 mb-4">
                <div class="card h-100 border-danger">
                    <div class="card-header bg-danger text-white fw-bold">
                        Live Security Alerts & Infractions
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Time</th>
                                        <th>Roll No</th>
                                        <th>Name</th>
                                        <th>Violation</th>
                                    </tr>
                                </thead>
                                <tbody id="logsTableBody">
                                    <tr><td colspan="4" class="text-center">Loading Firebase data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js?v=2"></script>
    <script src="js/admin.js?v=2"></script>
    <script src="js/app.js?v=9"></script>
</body>
</html>
