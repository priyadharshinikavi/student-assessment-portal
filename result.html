<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">Assessment Portal</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm" id="resultCard">
                    <div class="card-header text-center py-3" id="resultHeader">
                        <h4 class="mb-0">Assessment Result</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-4 text-center">
                            <div class="col-sm-6 text-sm-end border-end pe-4">
                                <p class="text-muted mb-1">Student Name</p>
                                <h5 id="resName"></h5>
                                <p class="text-muted mb-1 mt-3">Subject</p>
                                <h5 class="text-capitalize" id="resSubject"></h5>
                            </div>
                            <div class="col-sm-6 text-sm-start ps-4">
                                <p class="text-muted mb-1">Roll Number</p>
                                <h5 id="resRoll"></h5>
                                <p class="text-muted mb-1 mt-3">Set</p>
                                <h5 id="resSet"></h5>
                            </div>
                        </div>

                        <div class="row text-center mb-4 bg-light rounded p-3 mx-1">
                            <div class="col-4 border-end">
                                <h3 class="text-success mb-0" id="resCorrect">0</h3>
                                <small class="text-muted">Correct</small>
                            </div>
                            <div class="col-4 border-end">
                                <h3 class="text-danger mb-0" id="resWrong">0</h3>
                                <small class="text-muted">Wrong</small>
                            </div>
                            <div class="col-4">
                                <h3 class="text-secondary mb-0" id="resUnanswered">0</h3>
                                <small class="text-muted">Unanswered</small>
                            </div>
                        </div>

                        <div class="text-center mb-4">
                            <h1 class="display-3 fw-bold" id="resPercentage">0%</h1>
                            <h4 id="resStatusText" class="mt-2"></h4>
                        </div>
                        
                        <div id="failMessage" class="alert alert-danger text-center" style="display: none;">
                            <i class="bi bi-exclamation-triangle-fill"></i> Required Pass Percentage is 75%. Please retake the test.
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4" id="actionButtons">
                            <!-- Buttons injected dynamically based on status -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Answer Review Section (Hidden initially) -->
        <div id="reviewSection" class="mt-5" style="display: none;">
            <h3 class="border-bottom pb-2 mb-4">Answer Review</h3>
            <div id="reviewContainer">
                <!-- Review blocks injected here -->
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/result.js"></script>
</body>
</html>
