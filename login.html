<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Technical Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        body {
            background: url('assets/education_bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #f4f6f9; /* fallback */
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95); /* Slight transparency for effect */
            backdrop-filter: blur(5px);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Technical Assessment Portal</h3>
                <p class="text-muted">Enter your details to proceed</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="studentName" class="form-label">Student Name</label>
                    <input type="text" class="form-control" id="studentName" required placeholder="Enter your full name">
                </div>
                
                <div class="mb-3">
                    <label for="course" class="form-label">Course / Track</label>
                    <select class="form-select" id="course" required>
                        <option value="">Select Course</option>
                        <option value="frontend">Frontend Developer</option>
                        <option value="data_analyst">Data Analyst</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="rollNumber" class="form-label">Roll Number</label>
                    <select class="form-select" id="rollNumber" required disabled>
                        <option value="">Select Course First</option>
                        <!-- Options generated via JS -->
                    </select>
                    <div id="loginError" class="text-danger mt-2 small" style="display: none;"></div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                <div class="text-center mt-3">
                    <a href="admin.html" class="text-muted small text-decoration-none">Admin Dashboard</a>
                </div>
            </form>
        </div>
    </div>
    
    <div style="position: fixed; bottom: 10px; width: 100%; text-align: center;">
        <small class="text-muted fst-italic">website developed by priyadharshini kavi copyrights @2026</small>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
