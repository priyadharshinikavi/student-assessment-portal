<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Technical Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        body {
            background: url('assets/education_bg.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #f4f6f9; /* fallback */
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            background: #ffffff; /* Solid white */
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: none;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary mb-1"><i class="bi bi-mortarboard-fill me-2"></i>Technical Assessment <span style="color: #0d6efd;">Portal</span></h4>
                <p class="text-muted small mt-2">Enter your details to proceed</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="studentName" class="form-label fw-semibold" style="font-size: 0.9rem;">Student Name</label>
                    <input type="text" class="form-control" id="studentName" required placeholder="Enter your full name">
                </div>
                
                <div class="mb-3">
                    <label for="course" class="form-label fw-semibold" style="font-size: 0.9rem;">Course / Track</label>
                    <select class="form-select" id="course" required>
                        <option value="">Select Course</option>
                        <option value="frontend">Frontend Developer</option>
                        <option value="data_analyst">Data Analyst</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="rollNumber" class="form-label fw-semibold" style="font-size: 0.9rem;">Roll Number</label>
                    <select class="form-select" id="rollNumber" required disabled>
                        <option value="">Select Course First</option>
                        <!-- Options generated via JS -->
                    </select>
                    <div id="loginError" class="text-danger mt-2 small" style="display: none;"></div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login <i class="bi bi-arrow-right ms-1"></i></button>
                <div class="text-center mt-3">
                    <a href="admin.html" class="text-primary small text-decoration-none" style="font-size: 0.85rem;">Admin Dashboard</a>
                </div>
            </form>
        </div>
    </div>
    
    <div style="position: fixed; bottom: 10px; width: 100%; text-align: center;">
        <small class="text-white fst-italic" style="opacity: 0.9;">website developed by priyadharshini kavi copyrights @2026</small>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
