<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Technical Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Technical Assessment Portal</h3>
                <p class="text-muted">Enter your details to proceed</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="studentName" class="form-label">Student Name</label>
                    <input type="text" class="form-control" id="studentName" required placeholder="Enter your full name">
                </div>
                
                <div class="mb-4">
                    <label for="rollNumber" class="form-label">Roll Number</label>
                    <select class="form-select" id="rollNumber" required>
                        <option value="">Select Roll Number</option>
                        <!-- Options generated via JS -->
                    </select>
                    <div id="loginError" class="text-danger mt-2 small" style="display: none;"></div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
